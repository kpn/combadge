[project]
name = "combadge"
requires-python = ">=3.12.0,<4.0.0"
dynamic = ["version"]

[tool.poetry]
authors = [
    "Pavel Perestoronin <pavel.perestoronin@kpn.com>",
]
description = "Generic API client based on Pydantic"
keywords = ["api", "api-client", "pydantic"]
license = "Apache-2.0"
name = "combadge"
readme = "README.md"
repository = "https://github.com/kpn/combadge"
version = "0.0.0"
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: System",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

[tool.mypy]
allow_redefinition = true
allow_untyped_globals = true
check_untyped_defs = true
disable_error_code = "type-abstract" # https://github.com/python/mypy/issues/4717
pretty = true
warn_unused_configs = true
warn_redundant_casts = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "B",
    "C4",
    "COM",
    "D",
    "E",
    "F",
    "I",
    "N",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "SIM",
    "T20",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "ANN401",
    "D100",
    "D103",
    "D104",
    "D105",
    "D202",
    "D203",
    "D212",  # alternative of D213
    "D406",
    "D407",
    "D413",
    "TRY003",
    "UP040",  # FIXME
    "UP046",  # FIXME
]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D101", "D102", "D106"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.pytest.ini_options]
addopts = "--block-network --cov=./ --cov-report=xml"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.coverage.run]
branch = true
omit = ["tests/*"]
source = ["combadge"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "except ImportError",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry.dependencies]
annotated-types = ">=0.8.0,<0.9.0"
httpx2 = {version = ">=2.16.2,<3.0.0", optional = true}
lxml = ">=6.1.3,<7.0.0"
pydantic = ">=2.14.3,<3.0.0"
typing-extensions = ">=4.16.0,<5.0.0"
zeep = {version = ">=4.3.3,<5.0.0", extras = ["async"], optional = true}

[tool.poetry.extras]
httpx = ["httpx2"]
httpx2 = ["httpx2"]
zeep = ["zeep"]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
mypy = "2.4.1"
pytest = "9.2.0"
pytest-cov = "7.1.0"
types-requests = "2.33.0.20261030"
ruff = "0.17.5"
pytest-recording = "0.15.0"
pytest-asyncio = "1.5.0"
urllib3 = "2.8.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
black = "26.10.1"
cairosvg = "2.9.1"
mkdocs-autorefs = "1.4.5"
mkdocs-git-committers-plugin-2 = "2.5.0"
mkdocs-git-revision-date-localized-plugin = "1.7.0"
mkdocs-material = "9.8.1"
mkdocstrings = { version = "1.0.8", extras = ["python"] }
pillow = "13.0.0"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
pattern = "default-unprefixed"
style = "pep440"
strict = true
latest-tag = true
